packages:
  - packages/*
  - apps/*

catalog:
  "@biomejs/biome": ^2.5.15
  "@fontsource-variable/figtree": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@types/node": ^22.20.5
  electron: ^44.6.0
  typescript: ^7.0.2
  vite: ^8.3.3
  vitest: ^5.0.3
  wrangler: 4.149.0
  zod: ^4.6.5

# Electron downloads its binary on first launch, and esbuild and workerd (from wrangler) ship their binaries as
# optional platform packages, so none of them needs an install script.
allowBuilds:
  electron: false
  esbuild: false
  workerd: false
