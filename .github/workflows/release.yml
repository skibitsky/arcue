name: Release

# Builds the desktop app, with the arcue command, for macOS, Windows and Linux on Arm and x64. Windows and Linux build
# on a runner of each architecture. Both macOS apps build on Apple silicon, as pnpm has no Intel macOS build, and the
# Intel app runs there under Rosetta. Each job installs what it built, checks that arcue runs from PATH on the app's
# own Node and opens models in the app, and uninstalls it again. A tag v<version>, where <version> is the version in apps/desktop/package.json,
# then publishes a GitHub release with the installers, SHA256SUMS.txt and build provenance attestations. Pull requests
# that change the packaging, and manual runs, keep the installers as workflow artifacts instead.
#
# Signing runs for tags and manual runs, and only when its secrets are set, so forks and pull requests build unsigned:
# - macOS: MACOS_CERTIFICATE, a base64 .p12 of a Developer ID Application certificate, and MACOS_CERTIFICATE_PASSWORD
#   sign the app and its disk image. APPLE_API_KEY, the text of an App Store Connect API key's .p8 file, with
#   APPLE_API_KEY_ID and APPLE_API_ISSUER, notarizes both too. Without a certificate the app is signed ad hoc.
# - Windows: the AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET secrets of an app registration, with the
#   repository variables ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT and ARTIFACT_SIGNING_PROFILE, sign the app
#   and its setup program with Azure Artifact Signing. Without them both are unsigned.
# - Linux packages are not signed. The checksums and attestations cover every platform's files.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - apps/desktop/**
      - apps/cli/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: mac-arm64, platform: darwin, arch: arm64, runner: macos-latest }
          - { target: mac-x64, platform: darwin, arch: x64, runner: macos-latest }
          - { target: win-x64, platform: win32, arch: x64, runner: windows-latest }
          - { target: win-arm64, platform: win32, arch: arm64, runner: windows-11-arm }
          - { target: linux-x64, platform: linux, arch: x64, runner: ubuntu-latest }
          - { target: linux-arm64, platform: linux, arch: arm64, runner: ubuntu-24.04-arm }
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      SIGN: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag names the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: node apps/desktop/scripts/version.ts "$GITHUB_REF_NAME"

      - name: Set up macOS signing
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$SIGN" != true ] || [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "::notice::Signing the macOS app ad hoc, without notarizing it: this is a pull request, or MACOS_CERTIFICATE or MACOS_CERTIFICATE_PASSWORD is not set."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          existing=$(security list-keychains -d user | tr -d '"' | xargs)
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity."
            exit 1
          fi
          {
            echo "ARCUE_MACOS_IDENTITY=$identity"
            echo "ARCUE_MACOS_KEYCHAIN=$keychain"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            {
              echo "ARCUE_APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
              echo "ARCUE_APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "ARCUE_APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
          else
            echo "::notice::Signing the macOS app without notarizing it: APPLE_API_KEY, APPLE_API_KEY_ID or APPLE_API_ISSUER is not set."
          fi

      - name: Package the app with its arcue command
        run: pnpm --filter @arcue/desktop package "$PLATFORM" "$ARCH"

      - name: Check for Windows signing
        id: windows-signing
        if: runner.os == 'Windows'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          if [ "$SIGN" = true ] && [ -n "$AZURE_TENANT_ID" ] && [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] &&
            [ -n "$ENDPOINT" ] && [ -n "$ACCOUNT" ] && [ -n "$PROFILE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not signing the Windows app: this is a pull request, or an AZURE_ secret or ARTIFACT_SIGNING_ variable is not set."
          fi
      - name: Sign the Windows app
        if: steps.windows-signing.outputs.present == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\apps\desktop\out\Arcue-win32-${{ matrix.arch }}
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Make the installers
        run: pnpm --filter @arcue/desktop make "$PLATFORM" "$ARCH"

      - name: Sign the Windows setup program
        if: steps.windows-signing.outputs.present == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\apps\desktop\out\make
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install from the disk image and run arcue through a link on PATH
        if: runner.os == 'macOS'
        run: |
          image=$(echo apps/desktop/out/make/*.dmg)
          mount=$(mktemp -d)
          hdiutil attach "$image" -nobrowse -readonly -mountpoint "$mount"
          mkdir -p "$RUNNER_TEMP/Applications" "$RUNNER_TEMP/bin"
          ditto "$mount/Arcue.app" "$RUNNER_TEMP/Applications/Arcue.app"
          hdiutil detach "$mount"
          app="$RUNNER_TEMP/Applications/Arcue.app"
          if [ "$ARCH" = x64 ]; then want=x86_64; else want=arm64; fi
          [ "$(lipo -archs "$app/Contents/MacOS/Arcue")" = "$want" ]
          codesign --verify --deep --strict "$app"
          if [ -n "${ARCUE_APPLE_API_KEY:-}" ]; then
            xcrun stapler validate "$app"
            xcrun stapler validate "$image"
            spctl --assess --type execute "$app"
          fi
          ln -s "$app/Contents/Resources/bin/arcue" "$RUNNER_TEMP/bin/arcue"
          PATH="$RUNNER_TEMP/bin:$PATH" node apps/desktop/scripts/smoke.ts arcue "$app/Contents/MacOS/Arcue"

      - name: Install with the setup program, run arcue from PATH, and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem apps/desktop/out/make/*-setup.exe).FullName
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $installer = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$log" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { Get-Content $log; throw "The setup program exited with $($installer.ExitCode)." }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Arcue'
          $bin = Join-Path $app 'bin'
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not (($userPath -split ';') -contains $bin)) { throw "Setup did not add $bin to the user's PATH: $userPath" }
          $env:Path = "$userPath;$env:Path"
          $found = (Get-Command arcue).Source
          if ($found -ne (Join-Path $bin 'arcue.exe')) { throw "arcue on PATH is $found." }
          arcue help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "arcue help exited with $LASTEXITCODE in PowerShell 7." }
          powershell.exe -NoProfile -NonInteractive -Command 'arcue help | Out-Null; exit $LASTEXITCODE'
          if ($LASTEXITCODE -ne 0) { throw "arcue help exited with $LASTEXITCODE in Windows PowerShell." }
          node apps/desktop/scripts/smoke.ts arcue (Join-Path $app 'Arcue.exe')
          if ($LASTEXITCODE -ne 0) { throw "The smoke test failed." }

          Start-Process -FilePath (Join-Path $app 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $deadline = (Get-Date).AddMinutes(2)
          $onPath = { ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -contains $bin }
          while (((Test-Path (Join-Path $app 'Arcue.exe')) -or (& $onPath)) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $app 'Arcue.exe')) { throw "The uninstaller left $app." }
          if (& $onPath) { throw "The uninstaller left $bin on the user's PATH." }

      - name: Install the Debian package, run arcue from PATH, and remove it
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          sudo apt-get install -y "$(echo "$PWD"/apps/desktop/out/make/*.deb)"
          [ "$(command -v arcue)" = /usr/bin/arcue ]
          [ "$(stat -c %a /usr/lib/arcue/chrome-sandbox)" = 4755 ]
          xvfb-run -a node apps/desktop/scripts/smoke.ts arcue /usr/lib/arcue/Arcue
          sudo apt-get remove -y arcue
          [ ! -e /usr/bin/arcue ] && [ ! -e /usr/lib/arcue ]
      - name: Run arcue from the tarball
        if: runner.os == 'Linux'
        run: |
          mkdir "$RUNNER_TEMP/tarball"
          tar -xzf apps/desktop/out/make/*.tar.gz -C "$RUNNER_TEMP/tarball"
          app=$(echo "$RUNNER_TEMP"/tarball/Arcue-*)
          out=$("$app/bin/arcue" setup)
          echo "$out"
          [[ $out == "Arcue runs on Node "*" at $app/Arcue, so there is nothing to set up." ]]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.target }}
          path: apps/desktop/out/make/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Read the version
        id: version
        run: |
          node apps/desktop/scripts/version.ts "$GITHUB_REF_NAME" > "$RUNNER_TEMP/version.json"
          echo "version=$(jq -r .version "$RUNNER_TEMP/version.json")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r .prerelease "$RUNNER_TEMP/version.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Write the checksums
        working-directory: ${{ runner.temp }}/release
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          MAC_NOTARIZED: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.APPLE_API_KEY != '' }}
          WINDOWS_SIGNED: ${{ secrets.AZURE_CLIENT_SECRET != '' && vars.ARTIFACT_SIGNING_PROFILE != '' }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Install the desktop app as [INSTALL.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/INSTALL.md#desktop-app) describes. It puts the \`arcue\` command on PATH."
            echo
            if [ "$MAC_NOTARIZED" = true ]; then
              echo "- macOS: signed with a Developer ID and notarized."
            else
              echo "- macOS: not notarized. Open Arcue once from System Settings > Privacy & Security > Open Anyway."
            fi
            if [ "$WINDOWS_SIGNED" = true ]; then
              echo "- Windows: signed."
            else
              echo "- Windows: not signed. In the SmartScreen warning, choose More info > Run anyway."
            fi
            echo "- Every file: checked by SHA256SUMS.txt, and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\` proves this workflow built it."
            echo
          } > "$notes"
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "::error::The release $TAG is already published."
            exit 1
          fi
          files=("$RUNNER_TEMP"/release/*)
          if [ "$draft" = none ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Arcue $VERSION" \
              --notes-file "$notes" --generate-notes "${flags[@]}" "${files[@]}"
          else
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
