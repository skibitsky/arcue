name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: shellcheck --shell=sh apps/plugin/launcher/arcue && shellcheck apps/plugin/scripts/launcher-smoke.sh
      - name: Check the packed @arcue/blend package
        run: pnpm --filter @arcue/blend build && pnpm --filter @arcue/blend check:package

  plugin:
    name: Build the plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arcue/plugin build
      - run: tar -cf plugin.tar -C apps/plugin/dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: plugin.tar
          retention-days: 7

  launcher:
    name: Launcher on ${{ matrix.os }}
    needs: plugin
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test the launchers
        run: pnpm exec vitest run --project @arcue/plugin apps/plugin/launcher
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: ${{ runner.temp }}/artifact
      - name: Install the plugin from git, as Claude Code and Codex do
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          git config --global core.autocrlf true
          mkdir branch "My Models"
          tar -xf artifact/plugin.tar -C branch
          git -C branch init --quiet
          git -C branch add --all
          git -C branch -c user.name=ci -c user.email=ci@localhost commit --quiet --message plugin
          git clone --quiet branch "plugin & (x) 100%"
          cp "$GITHUB_WORKSPACE/samples/stone-striker.fbx" "My Models/stone striker.fbx"
          scripts="$RUNNER_TEMP/plugin & (x) 100%/plugins/arcue/skills/arcue/scripts"
          sample="$RUNNER_TEMP/My Models/stone striker.fbx"
          if [ "$RUNNER_OS" = Windows ]; then scripts=$(cygpath -w "$scripts"); sample=$(cygpath -w "$sample"); fi
          {
            echo "ARCUE_SCRIPTS=$scripts"
            echo "ARCUE_SAMPLE=$sample"
            echo "ARCUE_USER_DATA=$RUNNER_TEMP/arcue-data"
          } >> "$GITHUB_ENV"
      - name: Set up Node and run Arcue through the shell launcher, without Node on PATH
        shell: bash
        run: bash apps/plugin/scripts/launcher-smoke.sh "$ARCUE_SCRIPTS" "$ARCUE_SAMPLE"
      - name: Check the Node that setup installed on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node_bin=$(echo "$HOME"/Library/Caches/Arcue/runtime/node-v*-darwin-arm64/node)
          codesign --verify --strict "$node_bin"
          signature=$(codesign -dvv "$node_bin" 2>&1)
          grep -qF 'Authority=Developer ID Application: Node.js Foundation (HX7739G8FX)' <<<"$signature" || { echo "::error::$signature"; exit 1; }
          grep -qF 'TeamIdentifier=HX7739G8FX' <<<"$signature" || { echo "::error::$signature"; exit 1; }
          if xattr -p com.apple.quarantine "$node_bin" 2>/dev/null; then echo "::error::setup left a quarantine attribute"; exit 1; fi
      - name: Run Arcue through the .cmd launchers from Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: ./apps/plugin/scripts/launcher-smoke.ps1 -Scripts $env:ARCUE_SCRIPTS -Sample $env:ARCUE_SAMPLE -Runtime "$env:RUNNER_TEMP\rt ps5 & (x) 100% !"
      - name: Run Arcue through the .cmd launchers from PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./apps/plugin/scripts/launcher-smoke.ps1 -Scripts $env:ARCUE_SCRIPTS -Sample $env:ARCUE_SAMPLE -Runtime "$env:RUNNER_TEMP\rt ps7 & (x) 100% !"

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arcue/web exec playwright install --with-deps chromium
      - run: pnpm --filter @arcue/web test:e2e
      - run: pnpm --filter @arcue/plugin test:e2e
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence
          path: |
            apps/web/test-results/
            apps/web/screenshots/
            apps/plugin/test-results/
          retention-days: 7
          if-no-files-found: ignore
