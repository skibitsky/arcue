name: Publish plugin

# A push to main rebuilds the agent plugin and commits it to the plugin branch once the CI workflow has passed for that
# commit. Claude Code and Codex install from that branch. It holds only what apps/plugin builds, so never edit it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arcue/plugin build
      - name: Commit to the plugin branch
        working-directory: apps/plugin/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init --quiet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --quiet --depth 1 "$remote" plugin; then git reset --quiet FETCH_HEAD; fi
          git add --all
          if git rev-parse --verify --quiet HEAD > /dev/null && git diff --cached --quiet; then
            echo "The plugin has not changed."
            exit 0
          fi
          git commit --quiet --message "Build the plugin from ${SOURCE_SHA}"
          git push --quiet "$remote" HEAD:refs/heads/plugin
