name: Node pins

on:
  pull_request:
    paths: [apps/plugin/launcher/node-sha256sums.txt]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check every pinned Node archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node apps/plugin/scripts/pin-node.ts --check
